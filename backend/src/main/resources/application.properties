spring.application.name=campnav-backend

# PostgreSQL / Fly Managed Postgres Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/campnav}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:password}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate & Flyway settings
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:true}

# Application & Security Configuration
campnav.admin.email=${ADMIN_EMAIL:raphaelfrank720@gmail.com}
campnav.admin.password=${ADMIN_PASSWORD:CAMPNAV1111()}
campnav.app.base-url=${CAMPNAV_BASE_URL:http://localhost:8080}
campnav.email.enabled=${CAMPNAV_EMAIL_ENABLED:true}
campnav.cors.allowed-origins=${CAMPNAV_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8081,http://localhost:3000,http://localhost:8082,http://127.0.0.1:8080}

# Actuator Exposure
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT Configuration (explicitly bound to JWT_SECRET)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
