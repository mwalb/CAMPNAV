spring.application.name=campnav-backend

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/campnav
spring.datasource.username=postgres
spring.datasource.password=password

# H2 Configuration (For development/testing)
# spring.datasource.url=jdbc:h2:mem:campnavdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true

# Hibernate/Flyway settings
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Mail SMTP Configuration (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:charlesnestory793@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

campnav.admin.email=raphaelfrank720@gmail.com
campnav.app.base-url=${CAMPNAV_BASE_URL:http://localhost:8080}
campnav.email.enabled=${CAMPNAV_EMAIL_ENABLED:true}
