# fly.toml app configuration file generated for campnav-1 on 2026-10-17T07:20:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'campnav-1'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  CAMPNAV_EMAIL_ENABLED = 'true'
  PORT = '8080'
  SPRING_PROFILES_ACTIVE = 'prod'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '15s'
    method = 'GET'
    path = '/actuator/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
